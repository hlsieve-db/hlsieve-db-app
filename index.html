<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="hololive OFFICIAL CARD GAMEのカード検索・デッキ作成を支援する非公式データベース"
    />
    <meta name="theme-color" content="#f3f7fa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HLSieve DB</title>
    <script>
      ;(() => {
        let preference = 'system'
        try {
          const stored = localStorage.getItem('hlsieve:theme')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        const theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.documentElement.style.backgroundColor = dark
          ? '#0b121a'
          : '#f3f7fa'
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#0b121a' : '#f3f7fa')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
